version: '3.9'
services:
  redis:
    image: redis:7
    ports: ["6379:6379"]
    restart: unless-stopped
    
  chroma:
    image: chromadb/chroma:latest
    ports: ["8000:8000"]
    restart: unless-stopped
    
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: smartprobono_ai
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data:
