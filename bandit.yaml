# Bandit security scanner configuration
# This file configures bandit to ignore false positives from dependencies

exclude_dirs:
  - venv
  - node_modules
  - .git
  - __pycache__

skips:
  - B101  # assert_used
  - B110  # try_except_pass
  - B311  # random
  - B404  # subprocess
  - B603  # subprocess_without_shell_equals_true
  - B607  # start_process_with_partial_path

exclude:
  - backend/venv/
  - node_modules/
  - __pycache__/
  - .git/

confidence: MEDIUM
severity: MEDIUM
