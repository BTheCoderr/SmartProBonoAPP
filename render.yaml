services:
  - type: web
    name: smartProBonoAPP-Advanced
    env: python
    plan: starter
    branch: main
    autoDeploy: true
    rootDir: .
    buildCommand: |
      pip install --upgrade pip && pip install -r requirements-production.txt
    startCommand: |
      python advanced_multi_agent_api.py
    envVars:
      - key: PYTHON_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SUPABASE_URL
        value: https://ewtcvsohdgkthuyajyyk.supabase.co
      - key: SUPABASE_SERVICE_KEY
        value: ***REMOVED***
      - key: OPENAI_API_KEY
        value: your_openai_key_here
      - key: ANTHROPIC_API_KEY
        value: your_anthropic_key_here