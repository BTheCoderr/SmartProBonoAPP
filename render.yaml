services:
  - type: web
    name: smartProBonoAPP
    env: python
    plan: free
    branch: main
    autoDeploy: true
    rootDir: .
               buildCommand: |
             pip install --upgrade pip && pip install -r requirements_ultra_minimal.txt
    startCommand: |
      uvicorn simple_fastapi_app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SUPABASE_URL
        value: https://ewtcvsohdgkthuyajyyk.supabase.co
      - key: SUPABASE_SERVICE_KEY
        value: ***REMOVED***