services:
  - type: web
    name: smartprobono-backend
    env: python
    buildCommand: |
      echo "🚀 Starting SmartProBono FORCE deployment..."
      echo "🧹 Removing any PyMuPDF installations..."
      pip uninstall -y PyMuPDF pymupdf4llm || true
      echo "📦 Installing deployment requirements..."
      pip install -r requirements-deploy.txt
      echo "🔍 Verifying PyMuPDF is not installed..."
      python -c "import sys; sys.exit(0 if 'fitz' not in sys.modules else 1)" || pip uninstall -y PyMuPDF pymupdf4llm
      echo "✅ Dependencies installed successfully without PyMuPDF"
    startCommand: |
      echo "🚀 Starting SmartProBono backend..."
      cd backend
      python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PIP_NO_CACHE_DIR
        value: 1
      - key: PIP_DISABLE_PIP_VERSION_CHECK
        value: 1
    healthCheckPath: /api/v1/health
    plan: starter